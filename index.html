      --danger: #ff8a80;
      --danger-bg: #3a1512;
      --ok: #6fd39a;

  .review-cat{ font-size:.78rem; font-weight:700; color: var(--text-dim); text-transform:uppercase; letter-spacing:.03em; }
  .review-pick{ font-size:.98rem; font-weight:600; margin-top: 2px; }

  .confetti{ position:relative; height: 0; }

  .admin-cat{ margin-top: 22px; }
  .admin-cat h3{ font-size: 1.02rem; display:flex; align-items:center; gap:8px; }

  .bar-track{ flex:1; background: var(--surface-2); border-radius: 999px; height: 10px; overflow:hidden; }

  .admin-note{ margin-top: 22px; font-size: .78rem; color: var(--text-dim); }

  .footer-note{ text-align:center; margin-top: 18px; font-size: .74rem; color: var(--text-dim); }
</style>

  .btn-primary{
    background: linear-gradient(135deg,#ffb703,#ff5d8f);

    box-shadow: 0 6px 18px rgba(255,93,143,0.35);

  .btn-ghost{

  .btn-text{
    background: none; border: none; color: var(--accent-2); font-weight: 600; padding: 8px 4px;

  .btn-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top: 22px; flex-wrap: wrap; }

  .progress{ display:flex; gap:6px; justify-content:center; margin-bottom: 18px; }
  .dot{
    width: 22px; height: 22px; border-radius: 50%; font-size: .68rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    border: 2px solid var(--border); color: var(--text-dim); background: var(--surface);

  }
  .dot.done{ background: var(--ok); border-color: var(--ok); color: #fff; }
  .dot.current{ border-color: var(--accent-2); color: var(--accent-2); box-shadow: 0 0 0 3px rgba(194,42,99,0.15); }

  .cat-emoji{ font-size: 2.6rem; line-height: 1; margin-bottom: 8px; }

  .name-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 12px; margin-top: 20px; }
  .name-card{
    position: relative; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden;

  .name-card:active{ transform: scale(0.95); }
  .name-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit: cover; }

  }
  .name-card[aria-checked="true"] .name-check-badge{ opacity:1; transform: scale(1); }
  .name-card[aria-checked="true"] .name-label{
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(154,49,89,0.82) 78%, rgba(124,25,64,0.9) 100%);
  }
  .skip-link{ margin-top: 14px; text-align:center; }

  .intro-hero{ text-align:center; padding-block: 6px 4px; }
  .intro-hero .cat-emoji{ font-size: 3rem; }
  .intro-title{ font-size: clamp(1.7rem,6vw,2.3rem); font-weight: 800; margin-top: 6px; }
  .intro-sub{ color: var(--text-dim); margin-top: 12px; line-height:1.6; font-size: .96rem; }
  .stat-chip{
    display:inline-flex; align-items:center; gap:6px; margin-top: 16px;
    background: var(--surface-2); border-radius: 999px; padding: 7px 14px;
    font-size: .82rem; font-weight: 600; color: var(--text-dim);
  }
  .privacy-note{
    margin-top: 18px; font-size: .78rem; color: var(--text-dim);
    display:flex; align-items:center; gap:6px; justify-content:center;
  }
  .cta{ margin-top: 22px; text-align:center; }
  .cta .btn-primary{ font-size: 1.02rem; padding: 14px 28px; }

  .review-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .review-row:last-of-type{ border-bottom:none; }
  .review-left{ display:flex; gap:10px; align-items:flex-start; min-width:0; }
  .review-emoji{ font-size:1.3rem; flex:0 0 auto; }
  .review-cat{ font-size:.78rem; font-weight:700; color: var(--text-dim); text-transform:uppercase; letter-spacing:.03em; }
  .review-pick{ font-size:.98rem; font-weight:600; margin-top: 2px; }
  .review-pick.empty{ color: var(--text-dim); font-weight:500; font-style:italic; }

  .done-wrap{ text-align:center; padding-block: 10px; }
  .done-emoji{ font-size: 3.4rem; }
  .confetti{ position:relative; height: 0; }
  .confetti span{
    position:absolute; top:-10px; font-size:1.2rem; animation: fall 1.8s ease-in forwards;
  }
  @keyframes fall{ to{ transform: translateY(140px) rotate(180deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .confetti span{ animation:none; opacity:0; } }

  .notice{
    margin-top: 16px; padding: 12px 14px; border-radius: 14px; font-size: .86rem; line-height:1.5;

  .footer-note{ text-align:center; margin-top: 18px; font-size: .74rem; color: var(--text-dim); }
</style>
`;
  var LOGIC_SCRIPT_HTML = document.getElementById("ballot-logic").outerHTML;

  var state = { votes: [] };

  // ---- view state (per-viewer, local only until submit) ----
  var view = { step: "intro", catIndex: 0, picks: {} };

  function myVoteId(){
    var id = lsGet(MYVOTE_KEY);
    if(!id){ id = uid(); lsSet(MYVOTE_KEY, id); }
    return id;
  }

  function findMyVote(){
    var id = lsGet(MYVOTE_KEY);
    if(!id) return null;
    for(var i=0;i<state.votes.length;i++){
      if(state.votes[i].id === id) return state.votes[i];
    }
    return null;
  }

  function saveDraft(){
    ssSet(DRAFT_KEY, { step: view.step, catIndex: view.catIndex, picks: view.picks });
  }
  function restoreDraftIfAny(){
    var d = ssGet(DRAFT_KEY);
    if(d && d.picks){
      view.step = (d.step === "intro" || d.step === "done") ? "cat" : (d.step || "intro");
      view.catIndex = d.catIndex || 0;
      view.picks = d.picks;
      return true;
    }
    return false;
  }

  var app = document.getElementById("app");

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function render(){
    if(view.step === "intro") return renderIntro();
    if(view.step === "cat") return renderCategory();
    if(view.step === "review") return renderReview();
    if(view.step === "saving") return renderSaving();
    if(view.step === "done") return renderDone();
    if(view.step === "error") return renderError();
    if(view.step === "adminlogin") return renderAdminLogin();
    if(view.step === "admin") return renderAdmin();
  }

  function progressDots(){
    var html = '<div class="progress">';
    for(var i=0;i<CATEGORIES.length;i++){
      var cls = "dot";
      var content = String(i+1);
      var answered = Object.prototype.hasOwnProperty.call(view.picks, CATEGORIES[i].id);
      if(answered){ cls += " done"; content = "✓"; }
      if(view.step === "cat" && i === view.catIndex){ cls += " current"; }
      html += '<div class="'+cls+'">'+content+'</div>';
    }
    html += '</div>';
    return html;
  }

  function renderIntro(){
    var existing = findMyVote();
    var count = state.votes.length;
    app.innerHTML =
      '<div class="card intro-hero">' +
        '<div class="cat-emoji">🏆</div>' +
        '<div class="eyebrow">Bình chọn nội bộ · ẩn danh</div>' +
        '<h1 class="intro-title">Gala Danh Hiệu</h1>' +
        '<p class="intro-sub">8 danh hiệu vui dành cho team — mỗi danh hiệu, chọn ra một người bạn nghĩ tới đầu tiên. Vui là chính, đừng nghĩ quá nhiều nhé!</p>' +
        (count > 0 ? '<div class="stat-chip">🎉 Đã có <b>'+count+'</b> người tham gia bình chọn</div>' : '') +
        '<div class="cta"><button class="btn btn-primary" id="start-btn">' +
          (existing ? 'Sửa bình chọn của tôi ✏️' : 'Bắt đầu bình chọn 🎉') +
        '</button></div>' +
        '<div class="privacy-note">🕶️ Bình chọn ẩn danh — không ai biết bạn đã chọn ai.</div>' +
      '</div>' +
      '<div class="footer-note"><button class="btn-text" id="admin-link-btn" type="button" style="font-size:.74rem;">🔑 Ban tổ chức</button></div>';
    document.getElementById("start-btn").onclick = function(){
      var ex = findMyVote();
      view.picks = ex ? Object.assign({}, ex.picks) : {};
      view.step = "cat";
      view.catIndex = 0;
      saveDraft();
      render();
    };
    document.getElementById("admin-link-btn").onclick = function(){
      view.step = "adminlogin";
      render();
    };
  }

  var ADMIN_PASSCODE = "GALA2026";

  function renderAdminLogin(){
    app.innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="cat-emoji">🔑</div>' +
        '<h2 style="font-size:1.15rem;">Khu vực ban tổ chức</h2>' +
        '<p class="intro-sub">Nhập mật khẩu để xem kết quả tổng hợp.</p>' +
        '<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
          '<input id="admin-pass" type="password" placeholder="Mật khẩu" ' +
            'style="font-family:inherit;font-size:.95rem;padding:10px 14px;border-radius:999px;border:1px solid var(--chip-border);background:var(--chip-bg);color:var(--text);min-width:160px;">' +
        '</div>' +
        '<div id="admin-pass-error"></div>' +
        '<div class="cta"><button class="btn btn-primary" id="admin-pass-btn">Xem kết quả</button></div>' +
        '<div class="footer-note"><button class="btn-text" id="admin-back-btn" type="button">← Quay lại bình chọn</button></div>' +
      '</div>';
    var input = document.getElementById("admin-pass");
    async function tryLogin(){
      if(input.value === ADMIN_PASSCODE){
        try{ state.votes = await sbFetchVotes(); }catch(e){ /* fall back to last-known votes */ }
        view.step = "admin";
        render();
      } else {
        document.getElementById("admin-pass-error").innerHTML = '<div class="notice error">Sai mật khẩu, thử lại nhé.</div>';
      }
    }
    document.getElementById("admin-pass-btn").onclick = tryLogin;
    input.onkeydown = function(e){ if(e.key === "Enter") tryLogin(); };
    input.focus();
    document.getElementById("admin-back-btn").onclick = function(){
      view.step = "intro";
      render();
    };
  }

  function renderCategory(){
    var cat = CATEGORIES[view.catIndex];
    var picked = view.picks[cat.id];
    var chips = NAMES.map(function(name, idx){
      var checked = picked === name;
      var photo = PHOTOS[name];
      var inner;
      if(photo){
        inner = '<img class="name-photo" src="'+photo+'" alt="" aria-hidden="true">';
      } else {
        var pal = AVATAR_PALETTE[hashStr(name) % AVATAR_PALETTE.length];
        inner = '<div class="name-avatar-fallback" style="background:linear-gradient(135deg,'+pal[0]+','+pal[1]+')">'+esc(initialOf(name))+'</div>';
      }
      return '<button type="button" class="name-card" role="radio" aria-checked="'+(checked?'true':'false')+'" ' +
        'id="chip-'+cat.id+'-'+idx+'" data-name="'+esc(name)+'">' +
          inner +
          '<div class="name-check-badge">✓</div>' +
          '<div class="name-label">'+esc(name)+'</div>' +
        '</button>';
    }).join("");

    app.innerHTML =
      progressDots() +
      '<div class="card">' +
        '<div class="eyebrow">Danh hiệu '+(view.catIndex+1)+' / '+CATEGORIES.length+'</div>' +
        '<div class="cat-emoji">'+cat.emoji+'</div>' +
        '<div class="cat-title">'+esc(cat.title)+'</div>' +
        (cat.tagline ? '<div class="cat-tagline">'+esc(cat.tagline)+'</div>' : '') +
        '<div class="cat-desc">'+esc(cat.desc)+'</div>' +
        '<div class="name-grid" role="radiogroup" aria-label="Chọn người cho danh hiệu này">'+chips+'</div>' +
        '<div class="skip-link"><span class="btn-text skip-hint">Lướt lên để đọc câu hỏi</span></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" id="back-btn" type="button" '+(view.catIndex===0?'disabled':'')+'>← Quay lại</button>' +
          '<div class="right"><button class="btn btn-primary" id="next-btn" type="button">' +
            (view.catIndex === CATEGORIES.length-1 ? 'Xem lại phiếu →' : 'Tiếp theo →') +
          '</button></div>' +
        '</div>' +
      '</div>';

    var chipEls = app.querySelectorAll(".name-card");
    for(var i=0;i<chipEls.length;i++){
      chipEls[i].onclick = function(){
        var name = this.getAttribute("data-name");
        view.picks[cat.id] = name;
        saveDraft();
        renderCategory();
      };
    }
    document.getElementById("back-btn").onclick = function(){
      if(view.catIndex > 0){ view.catIndex--; saveDraft(); render(); }
    };
    document.getElementById("next-btn").onclick = function(){
      if(view.catIndex === CATEGORIES.length-1){ view.step = "review"; } else { view.catIndex++; }
      saveDraft();
      render();
    };
  }

  function renderReview(){
    var rows = CATEGORIES.map(function(cat, idx){
      var pick = view.picks[cat.id];
      return '<div class="review-row">' +
        '<div class="review-left"><span class="review-emoji">'+cat.emoji+'</span>' +
          '<div><div class="review-cat">'+esc(cat.title)+'</div>' +
          '<div class="review-pick'+(pick?'':' empty')+'">'+(pick ? esc(pick) : 'Đã bỏ qua')+'</div></div></div>' +
        '<button class="btn-text" data-idx="'+idx+'" type="button">Sửa</button>' +
      '</div>';
    }).join("");

    app.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">Xem lại trước khi gửi</div>' +
        '<h2 style="font-size:1.3rem;">Phiếu bình chọn của bạn</h2>' +
        '<div style="margin-top:14px;">'+rows+'</div>' +
        '<div id="review-notice"></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" id="back-review-btn" type="button">← Sửa tiếp</button>' +
          '<div class="right"><button class="btn btn-primary" id="submit-btn" type="button">Gửi bình chọn 🎊</button></div>' +
        '</div>' +
      '</div>';

    var editBtns = app.querySelectorAll("[data-idx]");
    for(var i=0;i<editBtns.length;i++){
      editBtns[i].onclick = function(){
        view.catIndex = parseInt(this.getAttribute("data-idx"),10);
        view.step = "cat";
        saveDraft();
        render();
      };
    }
    document.getElementById("back-review-btn").onclick = function(){
      view.catIndex = CATEGORIES.length-1;
      view.step = "cat";
      saveDraft();
      render();
    };
    document.getElementById("submit-btn").onclick = function(){
      submitBallot(view.picks);
    };
  }

  function renderSaving(){
    app.innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="cat-emoji">📮</div>' +
        '<h2 style="font-size:1.15rem;">Đang gửi bình chọn của bạn…</h2>' +
        '<p class="intro-sub">Chỉ mất vài giây thôi.</p>' +
      '</div>';
  }

  function renderError(msg, retryable){
    app.innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="cat-emoji">😅</div>' +
        '<h2 style="font-size:1.15rem;">Chưa gửi được bình chọn</h2>' +
        '<div class="notice error">'+esc(msg)+'</div>' +
        '<div class="cta"><button class="btn btn-primary" id="retry-btn">Thử lại</button></div>' +
      '</div>';
    document.getElementById("retry-btn").onclick = function(){
      submitBallot(view.picks);
    };
  }

  function renderDone(){
    var confettiSpans = "";
    var emojis = ["🎉","✨","🎊","🏆","💫"];
    for(var i=0;i<10;i++){
      var left = Math.round(Math.random()*100);
      var delay = (Math.random()*0.6).toFixed(2);
      var em = emojis[i % emojis.length];
      confettiSpans += '<span style="left:'+left+'%;animation-delay:'+delay+'s;">'+em+'</span>';
    }
    app.innerHTML =
      '<div class="card done-wrap">' +
        '<div class="confetti">'+confettiSpans+'</div>' +
        '<div class="done-emoji">🎉</div>' +
        '<h2 style="font-size:1.35rem;margin-top:8px;">Cảm ơn bạn đã bình chọn!</h2>' +
        '<p class="intro-sub">Kết quả sẽ được công bố sau khi ban tổ chức đóng bình chọn. Bạn có thể đóng trang này bây giờ.</p>' +
        '<div class="cta"><button class="btn btn-ghost" id="edit-again-btn">Sửa lại bình chọn của tôi</button></div>' +
      '</div>';
    document.getElementById("edit-again-btn").onclick = function(){
      var ex = findMyVote();
      view.picks = ex ? Object.assign({}, ex.picks) : {};
      view.step = "cat"; view.catIndex = 0;
      saveDraft();
      render();
    };
  }

  // ---- submit straight to the shared Supabase store (works for any
  // visitor -- no Claude account needed) ----
  async function submitBallot(picks){
    view.step = "saving";
    render();
    var id = myVoteId();
    var ts = Date.now();

    ssSet(RETRY_KEY, { picks: picks, tries: (ssGet(RETRY_KEY) ? ssGet(RETRY_KEY).tries : 0) });

    try{
      await sbUpsertVote(id, ts, picks);
      var newVotes = state.votes.filter(function(v){ return v.id !== id; });
      newVotes.push({ id: id, ts: ts, picks: picks });
      state.votes = newVotes;

      ssClear(RETRY_KEY);
      ssClear(DRAFT_KEY);
      ssSet(JUSTVOTED_KEY, true);
      view.step = "done";
      render();
    }catch(err){
      renderError("Có lỗi khi gửi bình chọn (mạng chập chờn?), thử lại giúp mình nhé.", true);
    }
  }

  function checkPendingRetry(){
    var pending = ssGet(RETRY_KEY);
    if(!pending) return false;
    var tries = pending.tries || 0;
    if(tries >= MAX_RETRIES){ ssClear(RETRY_KEY); return false; }
    ssSet(RETRY_KEY, { picks: pending.picks, tries: tries + 1 });
    view.picks = pending.picks;
    view.step = "saving";
    render();
    submitBallot(pending.picks);
    return true;
  }

  // ---- admin / results view ----
  async function resetAllVotes(){
    if(!confirm("Xoá toàn bộ phiếu đã ghi nhận? Không thể hoàn tác.")) return;
    try{
      await sbDeleteAllVotes();
      state.votes = [];
      renderAdmin();
    }catch(err){
      alert("Không xoá được, thử lại nhé. (" + err.message + ")");
    }
  }

  function renderAdmin(){
    var total = state.votes.length;
    var sections = CATEGORIES.map(function(cat){
      var tally = {};
      state.votes.forEach(function(v){
        var pick = v.picks && v.picks[cat.id];
        if(pick){ tally[pick] = (tally[pick]||0) + 1; }
      });
      var rows = Object.keys(tally).map(function(name){ return { name: name, count: tally[name] }; });
      rows.sort(function(a,b){ return b.count - a.count; });
      var max = rows.length ? rows[0].count : 0;
      var rowsHtml = rows.length ? rows.map(function(r, i){
        var pct = max ? Math.round((r.count/max)*100) : 0;
        return '<div class="bar-row">' +
          '<div class="bar-name">'+(i===0?'👑 ':'')+esc(r.name)+'</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
          '<div class="bar-count">'+r.count+'</div>' +
        '</div>';
      }).join("") : '<p class="intro-sub" style="margin-top:8px;">Chưa có phiếu nào cho danh hiệu này.</p>';
      return '<div class="admin-cat"><h3>'+cat.emoji+' '+esc(cat.title)+'</h3>'+rowsHtml+'</div>';
    }).join("");

    app.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">Chỉ dành cho ban tổ chức</div>' +
        '<div class="admin-title">🏆 Kết quả Gala Danh Hiệu</div>' +
        '<p class="intro-sub" style="margin-top:6px;">Tổng cộng <b>'+total+'</b> phiếu bình chọn đã ghi nhận.</p>' +
        sections +
        '<div class="btn-row"><button class="btn btn-ghost" id="admin-exit-btn" type="button">← Quay lại</button>' +
          '<div class="right"><button class="btn-text" id="admin-reset-btn" type="button" style="color:var(--danger);">🗑️ Xoá toàn bộ phiếu</button></div></div>' +
        '<div class="admin-note">Mật khẩu này chỉ nên giữ riêng cho ban tổ chức — đừng gửi kèm link bình chọn cho cả team.</div>' +
      '</div>';
    document.getElementById("admin-exit-btn").onclick = function(){
      view.step = "intro";
      render();
    };
    document.getElementById("admin-reset-btn").onclick = resetAllVotes;
  }

  // ---- init ----
  function renderLoading(){
    app.innerHTML =
      '<div class="card intro-hero">' +
        '<div class="cat-emoji">🏆</div>' +
        '<h2 style="font-size:1.15rem;">Đang tải…</h2>' +
      '</div>';
  }

  async function boot(){
    renderLoading();
    try{
      var results = await Promise.all([
        sbFetchVotes(),
        sbFetchPhotos().catch(function(){ /* ok: fall back to initials avatars */ })
      ]);
      state.votes = results[0];
    }catch(e){
      state.votes = [];
    }
    if(ssGet(JUSTVOTED_KEY)){
      ssClear(JUSTVOTED_KEY);
      view.step = "done";
      render();
    } else if(checkPendingRetry()){
      // handled inside
    } else if(restoreDraftIfAny()){
      render();
    } else {
      render();
    }
  }

  boot();
})();
</script></body></html>
